name: "Copilot Setup Steps"

on:
  workflow_dispatch:
    inputs:
      title:
        description: "Issue title"
        required: true
        type: string
      body:
        description: "Issue description"
        required: true
        type: string
jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest

    
    permissions:
      issues: write
      contents: read
    steps:
      - name: create Issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "${{ inputs.title }}" \
            --body "${{ inputs.body }}"
    
      
      
